    <script>
// Runs at the top of the body, before any listing has been parsed, so the filter is applied
// in the first paint rather than after one. Delegated from the document because the buttons
// below it do not exist yet when this executes.
(function () {
    var root = document.documentElement;
    root.className += " js";

    var tier = "0";
    try { tier = localStorage.getItem("tier") || "0"; } catch (e) { }
    if (tier !== "1" && tier !== "2") tier = "0";
    root.classList.add("tier-" + tier);

    document.addEventListener("click", function (e) {
        var button = e.target.closest && e.target.closest(".tier-btn");
        if (!button) return;
        var chosen = button.getAttribute("data-tier");
        root.classList.remove("tier-0", "tier-1", "tier-2");
        root.classList.add("tier-" + chosen);
        try { localStorage.setItem("tier", chosen); } catch (e) { }

        // <details> has no idea the choice was made inside it
        var panel = button.closest("details");
        if (panel) panel.open = false;
    });
})();
</script>

    <script>
    // A hub's list is the only thing on the site that scrolls inside the page, and the page
    // keys act on whatever holds focus, so the list is given it
    (function () {
        // A theme's years beside its rail, or the index's letters under its alphabet
        var list = document.querySelector(".letters");
        if (!list) {
            var railed = document.querySelector(".railed-body");
            if (railed && railed.querySelector(".theme-columns")) list = railed;
        }
        if (!list) return;

        function take() {
            // The stylesheet decides whether the list scrolls at all; below its breakpoints
            // the page is what scrolls, and focus here would take the keys off it
            if (list.scrollHeight > list.clientHeight) list.focus({ preventScroll: true });
        }

        take();

        // After the click, not during it: the jump that follows puts focus on the body
        var rail = document.querySelector(".year-rail, .rail");
        if (rail) rail.addEventListener("click", function () { setTimeout(take, 0); });
    })();
    </script>
