                <h1 class='visually-hidden'>I have wandered streets</h1>  

<p style='margin:0;'><em><small><small><time datetime="2015-07-20">20 <a href="/2015/07/">July</a> <a href="/2015/">2015</a></time></small></small></em></p>  

<p class='url' style='margin:0;'><em><small><small>https://poems.culturing.net/2015/07/i-have-wandered-streets/</small></small></em></p>  

<p>I have wandered streets,<br />
Each entrance blocked by blood of lamb,<br />
And I have seen no faces.  </p>

<p>These are empty places.</p>
