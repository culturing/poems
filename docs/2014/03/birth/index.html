                <h1>Birth</h1>

<p style='margin:0;'><em><small><small><time datetime="2014-03-05">05 <a href="/2014/03/">March</a> <a href="/2014/">2014</a></time></small></small></em></p>  

<p class='url' style='margin:0;'><em><small><small>https://poems.culturing.net/2014/03/birth/</small></small></em></p>  

<p>Birth is a slow and painful thing,<br />
a tumult,<br />
longing toward an end,<br />
but staggering,<br />
a shallow wake<br />
of nascence,  </p>

<p>For which death doth rend.</p>
