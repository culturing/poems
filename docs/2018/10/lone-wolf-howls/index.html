                <h1>Lone wolf howls</h1>

<p style='margin:0;'><em><small><small><time datetime="2018-10-02">02 <a href="/2018/10/">October</a> <a href="/2018/">2018</a></time></small></small></em></p>  

<p class='url' style='margin:0;'><em><small><small>https://poems.culturing.net/2018/10/lone-wolf-howls/</small></small></em></p>  

<p>Lone wolf howls,<br />
jaw deformed.  </p>

<p>Heart disease.  </p>

<p>Bite marks prove:<br />
no hope.</p>
