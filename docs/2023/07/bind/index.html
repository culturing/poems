                <h1>Bind</h1>

<p style='margin:0;'><em><small><small><time datetime="2023-07-28">28 <a href="/2023/07/">July</a> <a href="/2023/">2023</a></time></small></small></em></p>  

<p class='url' style='margin:0;'><em><small><small>https://poems.culturing.net/2023/07/bind/</small></small></em></p>  

<p>Wonder, wonder of the mind,<br />
what has we humans in a bind?<br />
If not too-certain categories,<br />
maybe too much wind?</p>
