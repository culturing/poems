                <h1>Do What I Say</h1>  

<p style='margin:0;'><em><small><small><time datetime="2026-02-16">16 <a href="/2026/02/">February</a> <a href="/2026/">2026</a></time></small></small></em></p>  

<p class='url' style='margin:0;'><em><small><small>https://poems.culturing.net/2026/02/do-what-i-say/</small></small></em></p>  

<p>I want you to do what I say,<br />
unless I'm wrong.<br />
Then tell me I'm wrong.  </p>
