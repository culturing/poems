                <h1>Scattershot</h1>  

<p style='margin:0;'><em><small><small><time datetime="2026-04-20"><a href="/2026/04/20/">20</a> <a href="/2026/04/">April</a> <a href="/2026/">2026</a></time></small></small></em></p>  

<p class='url' style='margin:0;'><em><small><small>https://poems.culturing.net/2026/04/20/scattershot/</small></small></em></p>  

<p>Two birds fly scattershot<br />
through humid air,<br />
crashing into windows.  </p>

<p>They fly off dazed<br />
but perhaps enlightened.  </p>

<p class='tags'><em><small><small><a href="/themes/nature/">nature</a> &middot; <a href="/themes/love/">love</a></small></small></em></p>
