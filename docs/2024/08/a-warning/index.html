                <h1>A Warning</h1>

<p style='margin:0;'><em><small><small><time datetime="2024-08-11">11 <a href="/2024/08/">August</a> <a href="/2024/">2024</a></time></small></small></em></p>  

<p class='url' style='margin:0;'><em><small><small>https://poems.culturing.net/2024/08/a-warning/</small></small></em></p>  

<p>Lost sheep want the shepherd's crook.<br />
They feel their need.<br />
But in the evening glow, few know<br />
that night will come. This is your warning.</p>
