                <h1>Dark Abyss</h1>

<p style='margin:0;'><em><small><small><time datetime="2025-10-29">29 <a href="/2025/10/">October</a> <a href="/2025/">2025</a></time></small></small></em></p>  

<p class='url' style='margin:0;'><em><small><small>https://poems.culturing.net/2025/10/dark-abyss/</small></small></em></p>  

<p>I feel a strange despair<br />
which does not answer to my thoughts<br />
or find release in any party tricks,<br />
but only in the dark abyss,<br />
the origin of all.</p>
