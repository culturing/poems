                <h1>Tools in the Soil</h1>

<p style='margin:0;'><em><small><small><time datetime="2025-09-07">07 <a href="/2025/09/">September</a> <a href="/2025/">2025</a></time></small></small></em></p>  

<p class='url' style='margin:0;'><em><small><small>https://poems.culturing.net/2025/09/tools-in-the-soil/</small></small></em></p>  

<p>It is not enough<br />
to have learned <em>how</em> to garden.  </p>

<p>I must put my tools in the soil<br />
and feel with my own hands<br />
the life of the earth.</p>
