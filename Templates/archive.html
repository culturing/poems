<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preload" href="/quattrocento-regular-webfont.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/quattrocento-bold-webfont.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/cinzel-regular-webfont.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" type="text/css" href="/fonts.css" />
    <link rel="stylesheet" type="text/css" href="/common.css" />
    <link rel="stylesheet" type="text/css" href="/navbar.css" />
    <link rel="stylesheet" type="text/css" href="/index.css" />
    <link rel="stylesheet" type="text/css" href="/dropdown.css" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="alternate" type="application/rss+xml" title="poems by culturing" href="/feed.xml" />
    <title>{{title}}</title>
    {{meta}}
    <script type="application/ld+json">{{schema}}</script>
</head>
<body>
    {{navbar}}
    <div id="container-parent">
        <div id="container">
            <div id="container-chronology" class="archive">
                {{breadcrumb}}
                <h1 class="{{headingClass}}">{{heading}}</h1>
                {{content}}
            </div>
        </div>
    </div>
    <script>
    // A hub's list is the only thing on the site that scrolls inside the page, and the page
    // keys act on whatever holds focus, so the list is given it
    (function () {
        var list = document.querySelector(".railed-body");
        if (!list || !list.querySelector(".theme-columns")) return;

        function take() {
            // The stylesheet decides whether the list scrolls at all; below its breakpoints
            // the page is what scrolls, and focus here would take the keys off it
            if (list.scrollHeight > list.clientHeight) list.focus({ preventScroll: true });
        }

        take();

        // After the click, not during it: the jump that follows puts focus on the body
        var rail = document.querySelector(".year-rail");
        if (rail) rail.addEventListener("click", function () { setTimeout(take, 0); });
    })();
    </script>
</body>
</html>
